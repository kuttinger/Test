name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Ganslessen.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ganslessen-APK
          path: Ganslessen.apk
      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ganslessen (Build ${{ github.run_number }})
          body: Lade **Ganslessen.apk** am Handy herunter und installiere sie.
          files: Ganslessen.apk
          make_latest: true
